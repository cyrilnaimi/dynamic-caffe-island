name: Release

# Push a tag like `v0.2.0` to publish a release:
#   1. build ONE universal (arm64 + x86_64) .app on Apple silicon
#   2. sign + notarize it when Developer ID secrets are configured
#      (otherwise ad-hoc sign — users must right-click → Open the first time)
#   3. smoke-test that exact artifact natively on Intel AND Apple silicon
#   4. publish DMG + ZIP + SHA-256 checksums to a GitHub Release
#
# Optional secrets for signing/notarization:
#   MACOS_CERT_P12_BASE64   base64 of the "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD     password of that .p12
#   APPLE_ID                Apple ID e-mail used for notarization
#   APPLE_TEAM_ID           10-character team ID
#   APPLE_APP_PASSWORD      app-specific password for notarytool
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || v="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Tests
        run: swift test --package-path Packages

      - name: Stamp version
        run: |
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"${{ steps.version.outputs.version }}\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"/" project.yml

      - name: Build universal app
        run: scripts/build-release.sh

      - name: Verify both architectures
        run: |
          archs=$(lipo -archs dist/DynamicCaffeIsland.app/Contents/MacOS/DynamicCaffeIsland)
          echo "architectures: $archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KC_PW="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign with Developer ID
        if: env.HAS_SIGNING == 'true'
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "Developer ID Application" dist/DynamicCaffeIsland.app
          codesign --verify --strict --verbose=2 dist/DynamicCaffeIsland.app

      - name: Package
        run: |
          v=${{ steps.version.outputs.version }}
          ditto -c -k --keepParent dist/DynamicCaffeIsland.app "dist/DynamicCaffeIsland-$v.zip"
          mkdir -p dmg && cp -R dist/DynamicCaffeIsland.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Dynamic Caffe Island" -srcfolder dmg -ov -format UDZO "dist/DynamicCaffeIsland-$v.dmg"

      - name: Notarize + staple
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          v=${{ steps.version.outputs.version }}
          codesign --sign "Developer ID Application" --timestamp "dist/DynamicCaffeIsland-$v.dmg"
          xcrun notarytool submit "dist/DynamicCaffeIsland-$v.dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/DynamicCaffeIsland-$v.dmg"

      - name: Checksums
        run: cd dist && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: intel
          - os: macos-15
            arch: apple-silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Unpack the released zip
        run: ditto -x -k dist/*.zip "$RUNNER_TEMP/app"
      - name: Launch natively and exercise keep-awake
        run: scripts/smoke-test.sh "$RUNNER_TEMP/app/DynamicCaffeIsland.app"

  publish:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dynamic Caffe Island ${{ needs.build.outputs.version }}" \
            --generate-notes
